services:
  leadhunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadhunter-pro
    restart: unless-stopped
    init: true                      # Предотвращает накопление zombie-процессов Playwright
    shm_size: '2gb'                 # Защита Chromium от OOM-крэшей на сервере
    expose:
      - "8000"                      # Доступен внутри сети Docker только для Nginx
    environment:
      - HEADLESS=1
      - PORT=8000
      - HOST=0.0.0.0
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SECRET_KEY=${SECRET_KEY}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@lead.pro}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminPass123!_ChangeMe}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_API_SERVER=${TELEGRAM_API_SERVER:-}
    volumes:
      # Сохранение базы данных SQLite (включая WAL/SHM журналы), лидов и профилей браузера
      - ./data:/app/data
      - ./exports:/app/exports
      - ./browser_profile:/app/browser_profile

  nginx:
    image: nginx:alpine
    container_name: leadhunter-nginx
    restart: unless-stopped
    ports:
      # Внешний порт (по умолчанию 8080, поддерживается Cloudflare Proxy из коробки)
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - leadhunter
