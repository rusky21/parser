# ====================================================================
# Nginx Virtual Host Configuration for LeadHunter Pro behind Cloudflare
# ====================================================================
# Разместите этот файл в: /etc/nginx/sites-available/leadhunter.conf
# Активация: ln -s /etc/nginx/sites-available/leadhunter.conf /etc/nginx/sites-enabled/
# Проверка: nginx -t && systemctl reload nginx

# 1. Маппинг для поддержки постоянных WebSocket соединений (стриминг лидов и прогресса)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. Доверенные подсети Cloudflare (IPv4 и IPv6) для корректного определения реального IP
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Извлекаем реальный IP из заголовка Cloudflare
real_ip_header CF-Connecting-IP;

# 3. Rate limiting зона на уровне Nginx для формы входа (первый эшелон защиты)
limit_req_zone $binary_remote_addr zone=leadhunter_login:10m rate=5r/m;

upstream leadhunter_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com; # Укажите ваш домен или поддомен

    # Максимальный размер загружаемого контента (для экспорта/импорта баз)
    client_max_body_size 50M;

    # Защитные HTTP-заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting для формы авторизации (POST /login)
    location = /login {
        limit_req zone=leadhunter_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://leadhunter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Проксирование WebSocket каналов (/ws/*)
    location /ws/ {
        proxy_pass http://leadhunter_backend;
        proxy_http_version 1.1;

        # Заголовки переключения протокола на WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Длительный таймаут для фонового стриминга (чтобы сокет не обрывался)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Основная маршрутизация приложения (API, статика фронтенда, отчеты)
    location / {
        proxy_pass http://leadhunter_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Передаем оригинальный протокол от Cloudflare (предотвращает loop HTTP <-> HTTPS)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
